[workspace]
resolver = "2"
members = [
  "mcs4-emu/crates/mcs4-core",
  "mcs4-emu/crates/mcs4-bus",
  "mcs4-emu/crates/mcs4-chips",
  "mcs4-emu/crates/mcs4-system",
  "mcs4-emu/crates/mcs4-gui",
  "mcs4-emu/crates/mcs4-fpga",
  "mcs4-emu/crates/mcs4-intellec",
  "mcs4-emu/crates/mcs4-periph",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Oichkatzelesfrettschen/4-bit"
authors = ["Oichkatzelesfrettschen"]

[workspace.dependencies]
# --- Core Logic & Bits ---
bitflags = "2.10"
num-traits = "0.2"
smallvec = { version = "1.13", features = ["serde", "union", "const_generics", "const_new"] }

# --- Zero-Copy & Persistence ---
rkyv = { version = "0.8", features = ["bytecheck"] }
memmap2 = "0.9"
bytemuck = { version = "1.24", features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Compile-Time Optimization ---
seq-macro = "0.3"

# --- Memory Management ---
mimalloc = { version = "0.1", default-features = false }
bumpalo = "3.19"

# --- Parallelism & Math ---
rayon = "1.11"
nalgebra = "0.34"
faer = "0.24"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Visualization & I/O ---
egui = "0.33"
eframe = "0.33"

# --- Tooling & Testing ---
clap = { version = "4.5", features = ["derive"] }
criterion = "0.5"
proptest = "1.4"
tempfile = "3"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unused = { level = "deny", priority = -1 }
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false
strip = true

[profile.dev]
opt-level = 1
debug = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = false
incremental = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.profiler]
inherits = "release"
debug = true
strip = false

# Zen3-release: use with `cargo build --profile zen3-release` and
# RUSTFLAGS="-C target-cpu=znver3" for AMD Zen 3 specific optimization.
[profile.zen3-release]
inherits = "release"

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = true
