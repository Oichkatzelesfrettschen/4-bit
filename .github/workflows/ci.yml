name: CI

on:
  # Quota hold: disable automatic CI lanes; allow manual runs only.
  workflow_dispatch:

env:
  # Shared system packages needed by egui/eframe (X11/Wayland)
  SYSTEM_DEPS: >-
    libxcb-render0-dev
    libxcb-shape0-dev
    libxcb-xfixes0-dev
    libxkbcommon-dev
    libssl-dev
  # Phase D10.1.3: pin locale and timezone so any locale-sensitive build
  # outputs (test harnesses comparing string formats, sorted output, etc.)
  # are reproducible across runners.
  LC_ALL: C
  TZ: UTC

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: rustfmt, clippy, miri, llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy-all

      - name: Tests
        run: cargo test --workspace --locked

      - name: Performance benchmarks (advisory)
        # Advisory only until docs/evidence/benchmarks_baseline_v0.json is
        # committed (tracked as debt task D18.1); failures never gate the job.
        run: |
          python3 scripts/benchmark_emulator_v0.py \
            --output docs/evidence/benchmarks_ci.json \
            --baseline docs/evidence/benchmarks_baseline_v0.json \
            --fail-on-regression
        continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 30

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Run benchmarks
        run: cargo bench --workspace --locked
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable toolchain (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: MSRV check
        run: cargo +1.92 check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: miri

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Miri on mcs4-core
        run: cargo +nightly-2026-04-05 miri test -p mcs4-core

      - name: Miri on mcs4-bus
        run: cargo +nightly-2026-04-05 miri test -p mcs4-bus

      - name: Miri on mcs4-chips
        run: cargo +nightly-2026-04-05 miri test -p mcs4-chips

      - name: Miri on mcs4-system
        run: cargo +nightly-2026-04-05 miri test -p mcs4-system

      # Phase D3.1.1: extend Miri coverage to the remaining four crates.
      # mcs4-gui touches eframe/winit which are not Miri-friendly; allow
      # failure so we still surface the rest.
      - name: Miri on mcs4-fpga
        run: cargo +nightly-2026-04-05 miri test -p mcs4-fpga

      - name: Miri on mcs4-intellec
        run: cargo +nightly-2026-04-05 miri test -p mcs4-intellec

      - name: Miri on mcs4-periph
        run: cargo +nightly-2026-04-05 miri test -p mcs4-periph

      - name: Miri on mcs4-gui (best-effort; egui/winit FFI may surface UB)
        run: cargo +nightly-2026-04-05 miri test -p mcs4-gui
        continue-on-error: true

  audit:
    # Phase D3.1.2: cargo-audit against the RustSec advisory database.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver_checks:
    # Phase D3.1.3: cargo-semver-checks against the most-depended-on crates.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: cargo-semver-checks (informational; no published baseline yet)
        run: cargo semver-checks check-release -p mcs4-bus -p mcs4-core --baseline-rev main || true

  no_default_features:
    # Phase D3.1.4: build matrix without default features for the heaviest
    # consumers, ensuring the workspace stays compilable when feature gates
    # are flipped off.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [mcs4-system, mcs4-chips]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Build (no default features)
        run: cargo build -p ${{ matrix.crate }} --no-default-features --locked

      - name: Test (no default features)
        run: cargo test -p ${{ matrix.crate }} --no-default-features --locked

  python_tests:
    # Phase D4.5: pytest smoke for evidence-pipeline scripts.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install --no-cache-dir pytest pyyaml

      - name: Run pytest smoke suite
        working-directory: scripts
        run: python -m pytest tests/ -q

  script_lint:
    # Lint gates for the evidence-pipeline scripts: ruff over Python,
    # shellcheck over shell. Both surfaces are kept warning-clean.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --no-cache-dir ruff

      - name: Ruff check
        run: ruff check --no-cache scripts/

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh

  fuzz_smoke:
    # Phase D4.2: compile fuzz targets and run each for 30s on every PR.
    # Full long-running corpus runs are intended for local developer sessions
    # and scheduled nightly runs; this job proves no immediate panics exist.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcs4-emu/fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Fuzz netlist_v0_parser (30s)
        working-directory: mcs4-emu
        run: >
          cargo +nightly-2026-04-05 fuzz run netlist_v0_parser
          fuzz/corpus/netlist_v0_parser
          -- -max_total_time=30
        continue-on-error: false

      - name: Fuzz netlist_v1_parser (30s)
        working-directory: mcs4-emu
        run: >
          cargo +nightly-2026-04-05 fuzz run netlist_v1_parser
          fuzz/corpus/netlist_v1_parser
          -- -max_total_time=30
        continue-on-error: false

      - name: Fuzz disasm_4004 (30s)
        working-directory: mcs4-emu
        run: >
          cargo +nightly-2026-04-05 fuzz run disasm_4004
          fuzz/corpus/disasm_4004
          -- -max_total_time=30
        continue-on-error: false

      - name: Fuzz rom_hex_loader (30s)
        working-directory: mcs4-emu
        run: >
          cargo +nightly-2026-04-05 fuzz run rom_hex_loader
          fuzz/corpus/rom_hex_loader
          -- -max_total_time=30
        continue-on-error: false
