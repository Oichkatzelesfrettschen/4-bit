name: CI

on:
  # Quota hold: disable automatic CI lanes; allow manual runs only.
  workflow_dispatch:

env:
  # Shared system packages needed by egui/eframe (X11/Wayland)
  SYSTEM_DEPS: >-
    libxcb-render0-dev
    libxcb-shape0-dev
    libxcb-xfixes0-dev
    libxkbcommon-dev
    libssl-dev

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: rustfmt, clippy, miri, llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy-all

      - name: Tests
        run: cargo test --workspace --locked

      - name: Performance benchmarks
        run: |
          python3 scripts/benchmark_emulator_v0.py \
            --output docs/evidence/benchmarks_ci.json \
            --baseline docs/evidence/benchmarks_baseline_v0.json \
            --fail-on-regression
        continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: llvm-tools-preview

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 30

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Run benchmarks
        run: cargo bench --workspace --locked
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable toolchain (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: MSRV check
        run: cargo +1.92 check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-05
          components: miri

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.SYSTEM_DEPS }}

      - name: Miri on mcs4-core
        run: cargo +nightly-2026-04-05 miri test -p mcs4-core

      - name: Miri on mcs4-bus
        run: cargo +nightly-2026-04-05 miri test -p mcs4-bus

      - name: Miri on mcs4-chips
        run: cargo +nightly-2026-04-05 miri test -p mcs4-chips

      - name: Miri on mcs4-system
        run: cargo +nightly-2026-04-05 miri test -p mcs4-system
