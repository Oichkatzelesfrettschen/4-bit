name: Docs CI

on:
  # Quota hold: disable automatic docs lanes; allow manual runs only.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yq \
            tesseract-ocr \
            python3-opencv \
            python3-pil \
            python3-pytesseract
      - name: Validate YAML
        run: scripts/doc_validate.sh
      - name: Doc Sync
        run: scripts/doc_sync.sh
      - name: Markdown Validate
        run: scripts/md_validate.sh
      - name: Check local Markdown links
        run: scripts/link_check.sh
      - name: OCR smoke
        run: python3 scripts/ocr_regression_smoke.py

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly-2026-04-05

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Set SOURCE_DATE_EPOCH
        # Pin the build timestamp to the commit time so rustdoc output is
        # byte-reproducible across runs of the same commit.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustdoc
          path: target/doc/
          retention-days: 7

  mdbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install mdBook
        run: |
          set -euo pipefail
          mdbook_version=0.4.44
          mdbook_sha256=326973fddabd7ff501f140ab529f3ede5f3f83f1a66ecc7e20adfec78eb6fc2a
          archive="$RUNNER_TEMP/mdbook-${mdbook_version}-x86_64-unknown-linux-gnu.tar.gz"
          install_dir="$RUNNER_TEMP/mdbook-${mdbook_version}"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${mdbook_version}/mdbook-v${mdbook_version}-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$mdbook_sha256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" --no-same-owner -C "$install_dir"
          install -m 0755 "$install_dir/mdbook" "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Set SOURCE_DATE_EPOCH
        # Pin the build timestamp to the commit time so the mdbook output is
        # byte-reproducible across runs of the same commit.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build book
        run: mdbook build

      - name: Upload book artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdbook
          path: target/book/
          retention-days: 7

  deploy-docs:
    needs: [validate, rustdoc, mdbook]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download rustdoc artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rustdoc
          path: site/api/

      - name: Download mdbook artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mdbook
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
