name: Docs CI
on:
  push:
    paths:
      - "**/*.md"
      - "docs/meta/registry.yaml"
      - "scripts/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: sudo apt-get update && sudo apt-get install -y yq
      - name: Validate YAML
        run: scripts/doc_validate.sh
      - name: Doc Sync
        run: scripts/doc_sync.sh
      - name: Markdown Validate
        run: scripts/md_validate.sh
