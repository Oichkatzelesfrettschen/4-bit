name: Docs CI
on:
  push:
    paths:
      - "**/*.md"
      - "docs/meta/registry.yaml"
      - "scripts/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yq \
            tesseract-ocr \
            python3-opencv \
            python3-pil \
            python3-pytesseract
      - name: Validate YAML
        run: scripts/doc_validate.sh
      - name: Doc Sync
        run: scripts/doc_sync.sh
      - name: Markdown Validate
        run: scripts/md_validate.sh
      - name: OCR smoke
        run: python3 scripts/ocr_regression_smoke.py
