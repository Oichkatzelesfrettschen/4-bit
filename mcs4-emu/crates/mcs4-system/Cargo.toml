[dev-dependencies]
tempfile.workspace = true
# `bumpalo` is only used in tests (`src/lib.rs::wiring_tests`); demoted from
# `[dependencies]` to `[dev-dependencies]` during debt phase D3.4 after
# `cargo +nightly udeps --workspace` flagged it as unused outside tests.
bumpalo.workspace = true
