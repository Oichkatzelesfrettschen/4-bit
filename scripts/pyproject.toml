[project]
name = "mcs4-scripts"
version = "0.1.0"
description = "Evidence pipeline and analysis scripts for the 4-bit (MCS-4/MCS-40) workspace"
requires-python = ">=3.11"
# Third-party imports the scripts actually use (verified via grep of
# scripts/*.py); versions pinned to what is installed and test-passing
# locally, since mcs4-emu/INSTALLATION.md names packages in prose without
# version numbers. onnxruntime/torch are optional (imported inside
# try/except in ocr_backend_v0.py, ocr_capabilities_v0.py,
# ocr_toolchain_smoke_v0.py) and stay out of the required set.
dependencies = [
    "Pillow==12.3.0",
    "numpy==2.5.1",
    "opencv-python==5.0.0.93",
    "pytesseract==0.3.13",
    "rapidocr-onnxruntime==1.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "ruff==0.14.11",
]

[tool.pytest.ini_options]
# pytest looks for tests under scripts/tests/ only; manual smoke tests like
# scripts/test_ocr_cache.py are explicitly excluded from automated discovery.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --tb=short"
markers = [
    "slow: long-running tests (skipped in CI quick runs)",
    "needs_tesseract: requires tesseract binary on PATH",
    "needs_cuda: requires a CUDA runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# E501 stays ignored: 643 long lines live in generated-ish analysis scripts and
# reflowing them risks churn without behavior benefit; all other rules gate.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest tests express expectations with bare assert by design.
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
