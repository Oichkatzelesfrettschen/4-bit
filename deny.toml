# deny.toml -- cargo-deny 0.19+ format
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# paste crate is unmaintained (RUSTSEC-2024-0436) but functional; no replacement available
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
]
confidence-threshold = 0.8
# Ubuntu Font Licence is not in SPDX but is permissive; used by egui default fonts
exceptions = [
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
