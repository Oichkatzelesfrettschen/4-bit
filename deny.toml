# deny.toml -- cargo-deny 0.19+ format
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# paste crate is unmaintained (RUSTSEC-2024-0436) but functional. Time-boxed:
# review at the first workspace dependency refresh after 2026-10-01; candidate
# replacement is the maintained pastey fork (drop-in) or removing the macro use.
# If the review passes without action, this ignore expires and cargo-deny fails.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained but functional; time-boxed to 2026-10-01, candidate replacement: pastey" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 pinned by wayland-scanner (winit stack); build-time proc-macro parsing trusted Wayland protocol XML; time-boxed to 2026-10-01, clears when the egui/winit stack bumps smithay" },
    { id = "RUSTSEC-2026-0195", reason = "same quick-xml pin as RUSTSEC-2026-0194; time-boxed to 2026-10-01" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no safe upgrade (egui font stack); time-boxed to 2026-10-01, clears when egui adopts a maintained font parser" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
]
confidence-threshold = 0.8
# Ubuntu Font Licence is not in SPDX but is permissive; used by egui default fonts
exceptions = [
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
