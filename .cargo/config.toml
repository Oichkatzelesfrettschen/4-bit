[build]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-D", "warnings",
]

[env]
RUSTDOCFLAGS = "-D warnings"

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-C", "target-cpu=x86-64-v3",
  "-D", "warnings",
]

# Future cross-compilation targets (uncomment when needed):
# [target.i686-unknown-linux-gnu]
# rustflags = ["-D", "warnings"]
#
# [target.aarch64-unknown-linux-gnu]
# rustflags = ["-D", "warnings"]
#
# [target.wasm32-unknown-unknown]
# rustflags = ["-D", "warnings"]

[alias]
clippy-all = "clippy --all-targets --all-features -- -D warnings"
fmt-all = "fmt --all"
miri-all = "miri test"
audit = "audit"
deny = "deny check"
cov = "llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info"
doc-coverage = "doc --workspace --no-deps -- -Z unstable-options --show-coverage"
bench-v3 = "bench --profile bench"
