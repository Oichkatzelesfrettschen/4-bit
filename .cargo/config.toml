[build]
rustflags = [
  "-C", "force-frame-pointers=yes",
  "-D", "warnings",
]

[env]
RUSTDOCFLAGS = "-D warnings"

# Per-target overrides: uncomment target-cpu for AVX2 optimization on capable machines.
# Use RUSTFLAGS="-C target-cpu=x86-64-v3" for benchmarks instead of hardcoding here.
# [target.x86_64-unknown-linux-gnu]
# rustflags = [
#   "-C", "force-frame-pointers=yes",
#   "-C", "target-cpu=x86-64-v3",
#   "-D", "warnings",
# ]

# Future cross-compilation targets (uncomment when needed):
# [target.i686-unknown-linux-gnu]
# rustflags = ["-D", "warnings"]
#
# [target.aarch64-unknown-linux-gnu]
# rustflags = ["-D", "warnings"]
#
# [target.wasm32-unknown-unknown]
# rustflags = ["-D", "warnings"]

[alias]
clippy-all = "clippy --locked --all-targets --all-features -- -D warnings"
fmt-all = "fmt --all"
miri-all = "miri test"
cov = "llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info"
doc-coverage = "doc --workspace --no-deps -- -Z unstable-options --show-coverage"
bench-v3 = "bench --profile bench"
